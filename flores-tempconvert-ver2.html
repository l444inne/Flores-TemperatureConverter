<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
</head>

<body>
    <h1>Temperature Converter</h1>

    <!--give user 2 options-->
    <label for="conversionType">Choose conversion:</label>
    <select id="conversionType">
        <option value="cToF">Celsius to Fahrenheit</option>
        <option value="fToC">Fahrenheit to Celsius</option>
    </select>

    <br><br>

    <!-- input-->
    <label id="inputLabel" for="tempInput">Enter temperature:</label>
    <input type="number" id="tempInput" placeholder="e.g., 25">

    <br><br>

    <!--1 calculate button-->
    <button id="calculateBtn">Calculate</button>

    <br><br>

    <!-- result-->
    <p id="result"></p>

    <script>
        const tempInput = document.getElementById('tempInput');
        const conversionType = document.getElementById('conversionType');
        const calculateBtn = document.getElementById('calculateBtn');
        const resultParagraph = document.getElementById('result');
        const inputLabel = document.getElementById('inputLabel');

        function convertTemperature() {
            const inputText = tempInput.value;
            const temperature = Number(inputText);

            const type = conversionType.value;
            
            if (type === 'cToF') {
                const result = temperature * 9 / 5 + 32;
                resultParagraph.innerHTML = temperature + '°C = ' + result + '°F';
            } else if (type === 'fToC') {
                const result = (temperature - 32) * 5 / 9;
                resultParagraph.innerHTML = temperature + '°F = ' + result + '°C';
            }
        }

        calculateBtn.addEventListener('click', convertTemperature);

    </script>
</body>
</html>
